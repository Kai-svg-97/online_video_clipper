# ruff 설정 — 지금 쓰는 규칙을 **그대로** 적어 둔다(기본값: E4·E7·E9·F).
#
# 이 파일이 생기기 전에는 기본 규칙에 E402 10건이 "기준선"으로 남아 있어서, 새 위반이
# 늘었는지를 사람이 세어 판단했다. 기준선을 0으로 만들고 CI(`.github/workflows/test.yml`)가
# `ruff check .` 로 지키게 했다 — 이제 위반은 한 건이라도 실패다.
#
# **`ruff format`은 저장소 전체에 돌리지 않는다.** 포맷이 적용된 적이 없는 저장소라
# 한 번에 돌리면 거의 모든 파일이 바뀌어 blame과 리뷰가 망가진다. 규칙을 넓히고 싶으면
# 여기 `extend-select`에 더하고, 같은 커밋에서 기존 위반을 0으로 만든다.

target-version = "py310"   # CLAUDE.md: Python 3.10+

[lint]
select = ["E4", "E7", "E9", "F"]
